name: anchor_heart
description: "Anchor World — topic community app"
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.0
  google_fonts: ^6.1.0
  get: ^4.6.6
  image_picker: ^1.0.0
  flutter_svg: ^1.1.6
  dio: ^5.0.3
  socket_io_client: ^2.0.3
  dropdown_button2: ^2.3.9
  # Firebase messaging for push notifications
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.2
  app_links: ^3.4.5

  url_launcher: ^6.3.2
  geolocator: ^13.0.0
  geocoding: ^3.0.0
  agora_rtc_engine: 6.3.2
  purchases_flutter: ^8.1.0
  share_plus: ^10.0.0
  video_player: ^2.9.2
  emoji_picker_flutter: ^4.3.0
  record: ^6.1.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  path: ^1.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 23  
